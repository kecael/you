<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaView - Vlog 学习</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: var(--bg-primary); color: var(--text-primary); -webkit-tap-highlight-color: transparent; }

    /* ===== 上下滑动主容器：占满导航栏以下可视区 ===== */
    .vlog-feed {
      position: fixed;
      top: 58px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .vlog-feed::-webkit-scrollbar { display: none; }

    .vlog-slide {
      height: 100%;
      min-height: 100%;
      max-width: 560px;
      margin: 0 auto;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 8px;
      position: relative;
      overflow: hidden;
    }

    /* 视频区 */
    .slide-media {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
    }
    .slide-media video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #000;
    }
    .slide-placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; cursor: pointer;
      background: linear-gradient(135deg, #1e293b, #0f172a 50%, #1e1b4b);
      color: rgba(255, 255, 255, 0.9);
    }
    .slide-placeholder .big-play {
      width: 76px; height: 76px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15); border: 3px solid rgba(255, 255, 255, 0.85);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: #fff; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }
    .slide-placeholder:hover .big-play { transform: scale(1.1); background: var(--primary-color); border-color: var(--primary-color); }
    .slide-placeholder .ph-title { font-size: 20px; font-weight: 700; color: #fff; text-align: center; padding: 0 20px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); }
    .slide-placeholder .ph-hint { font-size: 13px; color: rgba(255, 255, 255, 0.7); display: flex; align-items: center; gap: 6px; }

    /* 播放进度条（视频底部） */
    .progress-mini { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.18); z-index: 2; }
    .progress-mini .fill { height: 100%; background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end)); width: 0; }

    /* 右侧上下切换导航 */
    .slide-nav {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 3;
    }
    .nav-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.35);
      color: #fff; cursor: pointer; backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
    }
    .nav-btn:hover { background: var(--primary-color); border-color: var(--primary-color); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* 底部信息与操作条 */
    .slide-bar {
      display: flex; align-items: center; gap: 10px; padding: 10px 2px 8px;
    }
    .slide-btn {
      border: none; cursor: pointer; border-radius: 50%;
      width: 42px; height: 42px; background: var(--bg-card); color: var(--text-primary);
      display: flex; align-items: center; justify-content: center; font-size: 15px;
      border: 1px solid var(--border-color); transition: all 0.2s ease; flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .slide-btn:hover { background: var(--primary-color); color: #fff; }
    .slide-title-wrap { flex: 1; min-width: 0; }
    .slide-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slide-meta { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .slide-meta .level-tag { padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; color: #fff; }

    .subtitle-toggle-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 14px; border: none; border-radius: var(--radius-sm); cursor: pointer;
      background: var(--accent-bg); color: var(--primary-color); font-size: 13px; font-weight: 600;
      transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0;
    }
    .subtitle-toggle-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .subtitle-toggle-btn.active { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; }

    /* 底部字幕抽屉 */
    .slide-subs {
      position: relative;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
    }
    .slide-subs.open { max-height: 50vh; }
    .slide-subs-inner { display: flex; flex-direction: column; height: 50vh; }

    .subs-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
    }
    .transcribe-toggle-group { display: flex; gap: 4px; background: var(--bg-input); padding: 3px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
    .transcribe-toggle-btn {
      padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer;
      background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 600; transition: all 0.2s;
    }
    .transcribe-toggle-btn.active { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: #fff; }
    .subs-count { font-size: 12px; color: var(--text-muted); }

    .subs-list { flex: 1; overflow-y: auto; padding: 8px; }
    .subs-list::-webkit-scrollbar { width: 6px; }
    .subs-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    .subs-list::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .subs-item {
      padding: 12px 14px; margin-bottom: 4px; border-radius: var(--radius-sm);
      cursor: pointer; border-left: 3px solid transparent; transition: all 0.2s ease;
    }
    .subs-item:hover { background: var(--accent-bg); }
    .subs-item.active { background: linear-gradient(135deg, rgba(88, 101, 242, 0.12), rgba(59, 130, 246, 0.06)); border-left-color: var(--primary-color); }
    .subs-item .t { font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
    .subs-item .en { font-size: 14px; color: var(--text-primary); line-height: 1.6; }
    .subs-item .zh { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-top: 4px; display: none; }
    .slide-subs.translated .subs-item .zh { display: block; animation: fadeIn 0.3s ease; }

    .subs-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Toast 提示 */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(17, 24, 39, 0.92); color: #fff; padding: 12px 22px; border-radius: 10px;
      font-size: 14px; z-index: 9999; opacity: 0; pointer-events: none;
      transition: all 0.35s ease; backdrop-filter: blur(12px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .vlog-feed { top: 54px; }
      .vlog-slide { padding: 8px 10px 8px; }
      .slide-nav { right: 6px; }
      .slide-title { font-size: 15px; }
    }
  </style>
</head>

    // 从 localStorage 读取管理员上传的 Vlog 分类视频并合并
    function loadUserVlogs() {
      try {
        const savedVideos = JSON.parse(localStorage.getItem('linguaview_videos') || '[]');
        const userVlogs = savedVideos
          .filter(v => v.category === 'Vlog')
          .map(v => ({
            id: v.id,
            title: v.title,
            level: 'B1',
            levelColor: '#8b5cf6',
            duration: v.duration || 'N/A',
            gradient: 'linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%)',
            icon: 'fa-video',
            videoUrl: v.videoUrl,
            sourceId: v.sourceId || null,
            subtitles: (v.subtitles || []).map(s => ({
              start: typeof s.startTime === 'number' ? s.startTime : parseTimeStr(s.startTime),
              end: typeof s.endTime === 'number' ? s.endTime : parseTimeStr(s.endTime),
              en: s.english || '',
              zh: s.chinese || ''
            })).filter(s => s.en)
          }));
        // 合并：用户上传的排在前面
        vlogVideos.unshift(...userVlogs);
      } catch (e) {
        console.warn('加载用户Vlog失败:', e);
      }
    }

    // 时间字符串 "00:00:01,000" 转秒数
    function parseTimeStr(str) {
      if (typeof str === 'number') return str;
      if (!str || typeof str !== 'string') return 0;
      const parts = str.split(/[:,]/).map(Number);
      if (parts.length >= 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2] + (parts[3] || 0) / 1000;
      }
      return 0;
    }

    /* ========== 上下滑动流 ========== */

    // 状态
    let currentVideoIndex = 0;
    // 'english' | 'bilingual'，是否显示中文翻译
    let subtitleMode = 'bilingual';

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function getVid(i) { return document.getElementById('videoPlayer-' + i); }
    function getSlide(i) { return document.querySelector('.vlog-slide[data-index="' + i + '"]'); }

    function init() {
      loadUserVlogs();
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById('videoFeed');
      feed.innerHTML = vlogVideos.map((v, i) => buildSlide(v, i)).join('');
      setupSlideSources();
      setupIntersect();
      activateSlide(0);
    }

    function buildSlide(v, i) {
      const prevDisabled = i === 0 ? 'disabled' : '';
      const nextDisabled = i === vlogVideos.length - 1 ? 'disabled' : '';
      return `
        <section class="vlog-slide" data-index="${i}">
          <div class="slide-media">
            <video id="videoPlayer-${i}" playsinline preload="metadata"></video>
            <div class="slide-placeholder" id="ph-${i}" onclick="togglePlay(${i})">
              <div class="big-play"><i class="fa-solid fa-play"></i></div>
              <div class="ph-title">${esc(v.title)}</div>
              <div class="ph-hint"><i class="fa-solid fa-hand-pointer"></i> 点击播放 · 上滑 / 下滑切换视频</div>
            </div>
            <div class="progress-mini"><div class="fill" id="progressFill-${i}"></div></div>
            <div class="slide-nav">
              <button class="nav-btn" ${prevDisabled} onclick="goPrev()" title="上一个"><i class="fa-solid fa-chevron-up"></i></button>
              <button class="nav-btn" ${nextDisabled} onclick="goNext()" title="下一个"><i class="fa-solid fa-chevron-down"></i></button>
            </div>
          </div>
          <div class="slide-bar">
            <button class="slide-btn" onclick="togglePlay(${i})" title="播放/暂停"><i class="fa-solid fa-play" id="playIcon-${i}"></i></button>
            <button class="slide-btn" onclick="toggleMute(${i})" title="静音"><i class="fa-solid fa-volume-high" id="muteIcon-${i}"></i></button>
            <div class="slide-title-wrap">
              <div class="slide-title">${esc(v.title)}</div>
              <div class="slide-meta">
                <span class="level-tag" style="background:${v.levelColor};">${esc(v.level)}</span>
                <span><i class="fa-solid fa-clock"></i> ${esc(v.duration || '')}</span>
                <span>${v.subtitles.length}句</span>
              </div>
            </div>
            <button class="subtitle-toggle-btn" id="subsToggle-${i}" onclick="toggleSubtitles(${i})"><i class="fa-solid fa-closed-captioning"></i><span id="subsLabel-${i}">打开字幕</span></button>
          </div>
          <div class="slide-subs" id="slideSubs-${i}">
            <div class="slide-subs-inner">
              <div class="subs-toolbar">
                <div class="transcribe-toggle-group">
                  <button class="transcribe-toggle-btn" id="enBtn-${i}" onclick="setSubtitleMode('english', ${i})">纯英文</button>
                  <button class="transcribe-toggle-btn active" id="biBtn-${i}" onclick="setSubtitleMode('bilingual', ${i})">字幕翻译</button>
                </div>
                <span class="subs-count"><i class="fa-solid fa-hand-pointer"></i> 点击字幕跳转播放</span>
              </div>
              <div class="subs-list" id="subsList-${i}"></div>
            </div>
          </div>
        </section>
      `;
    }

    // 为每个视频设置数据源并绑定事件
    function setupSlideSources() {
      vlogVideos.forEach((v, i) => {
        const vid = getVid(i);
        if (!vid) return;
        if (v.videoUrl) {
          vid.src = v.videoUrl;
          vid.load();
        } else if (v.sourceId) {
          PersistentVideo.getVideoURL(v.sourceId).then(url => {
            if (url) { vid.src = url; vid.load(); }
          }).catch(err => console.warn('读取本地视频失败:', err));
        }
        vid.addEventListener('timeupdate', () => {
          updateProgress(i);
          if (i === currentVideoIndex) syncSubtitles(i);
        });
        vid.addEventListener('loadedmetadata', () => updateProgress(i));
        vid.addEventListener('play', () => { setPlayIcon(i, true); hidePlaceholder(i); });
        vid.addEventListener('pause', () => setPlayIcon(i, false));
        vid.addEventListener('ended', () => setPlayIcon(i, false));
      });
    }

    // 滚动到哪一屏就激活哪一屏
    function setupIntersect() {
      const feed = document.getElementById('videoFeed');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting && e.intersectionRatio > 0.5) {
            activateSlide(Number(e.target.dataset.index));
          }
        });
      }, { root: feed, threshold: [0, 0.5, 1] });
      document.querySelectorAll('.vlog-slide').forEach(s => obs.observe(s));
    }

    function activateSlide(i) {
      if (i === currentVideoIndex) return;
      currentVideoIndex = i;
      pauseOthers(i);
    }

    function pauseOthers(activeIdx) {
      document.querySelectorAll('.vlog-slide').forEach(sl => {
        const i = Number(sl.dataset.index);
        if (i === activeIdx) return;
        const vid = sl.querySelector('video');
        if (vid && !vid.paused) vid.pause();
      });
    }

    // 播放/暂停
    function togglePlay(i) {
      const v = vlogVideos[i];
      const vid = getVid(i);
      if (!vid) return;
      if (!v.videoUrl && !v.sourceId) { showToast('演示模式：此视频暂无视频源'); return; }
      if (vid.paused) {
        pauseOthers(i);
        activateSlide(i);
        vid.play().catch(() => showToast('视频加载失败，请检查视频源'));
      } else {
        vid.pause();
      }
    }

    function goPrev() { const el = getSlide(currentVideoIndex - 1); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    function goNext() { const el = getSlide(currentVideoIndex + 1); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

    // 静音
    function toggleMute(i) {
      const vid = getVid(i); if (!vid) return;
      vid.muted = !vid.muted;
      const ic = document.getElementById('muteIcon-' + i);
      if (ic) ic.className = vid.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    }

    function setPlayIcon(i, playing) {
      const ic = document.getElementById('playIcon-' + i);
      if (ic) ic.className = playing ? 'fa-solid fa-pause' : 'fa-solid fa-play';
    }
    function hidePlaceholder(i) {
      const ph = document.getElementById('ph-' + i);
      if (ph) ph.style.display = 'none';
    }

    // 进度条
    function updateProgress(i) {
      const vid = getVid(i); if (!vid) return;
      const pct = vid.duration ? (vid.currentTime / vid.duration) * 100 : 0;
      const fill = document.getElementById('progressFill-' + i);
      if (fill) fill.style.width = pct + '%';
    }

    /* ========== 字幕 ========== */

    // 打开 / 收起某个视频的字幕
    function toggleSubtitles(i) {
      const panel = document.getElementById('slideSubs-' + i);
      if (!panel) return;
      const open = panel.classList.toggle('open');
      const btn = document.getElementById('subsToggle-' + i);
      if (btn) btn.classList.toggle('active', open);
      const label = document.getElementById('subsLabel-' + i);
      if (label) label.textContent = open ? '收起字幕' : '打开字幕';
      // 首次打开时渲染字幕列表
      if (open && !panel.dataset.rendered) {
        renderSlideSubtitles(i);
        panel.dataset.rendered = '1';
      }
    }

    // 渲染某个视频的字幕列表
    function renderSlideSubtitles(i) {
      const v = vlogVideos[i];
      const list = document.getElementById('subsList-' + i);
      if (!list) return;
      if (!v.subtitles || v.subtitles.length === 0) {
        list.innerHTML = '<div class="subs-empty">暂无字幕</div>';
        return;
      }
      list.innerHTML = v.subtitles.map((s, k) => `
        <div class="subs-item" data-k="${k}" onclick="jumpToSubtitle(${i}, ${k})">
          <div class="t">${formatTime(s.start)} — ${formatTime(s.end)}</div>
          <div class="en">${esc(s.en)}</div>
          <div class="zh">${esc(s.zh)}</div>
        </div>
      `).join('');
    }

    // 字幕翻译切换：纯英文 / 中英对照
    function setSubtitleMode(mode, i) {
      subtitleMode = mode;
      document.querySelectorAll('.slide-subs').forEach(s => {
        s.classList.toggle('translated', mode === 'bilingual');
      });
      document.querySelectorAll('.transcribe-toggle-btn').forEach(b => b.classList.remove('active'));
      const enBtn = document.getElementById('enBtn-' + i);
      const biBtn = document.getElementById('biBtn-' + i);
      if (mode === 'english' && enBtn) enBtn.classList.add('active');
      if (mode === 'bilingual' && biBtn) biBtn.classList.add('active');
    }

    // 点击字幕跳转播放
    function jumpToSubtitle(i, k) {
      const v = vlogVideos[i];
      const vid = getVid(i);
      if (!vid || !v.subtitles[k]) return;
      vid.currentTime = v.subtitles[k].start;
      vid.play().catch(() => {});
    }

    // 随播放进度高亮当前字幕
    function syncSubtitles(i) {
      const v = vlogVideos[i];
      const vid = getVid(i);
      if (!vid || !v.subtitles) return;
      const t = vid.currentTime;
      const idx = v.subtitles.findIndex(s => t >= s.start && t <= s.end);
      if (idx === -1) return;
      const list = document.getElementById('subsList-' + i);
      if (!list || !list.children.length) return;
      Array.from(list.children).forEach((el, k) => el.classList.toggle('active', k === idx));
      const active = list.querySelector('.subs-item.active');
      if (active && idx !== list._lastActive) {
        active.scrollIntoView({ behavior: 'smooth', block: 'center' });
        list._lastActive = idx;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // 时间格式化
    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    init();
  </script>
</body>
</html>
